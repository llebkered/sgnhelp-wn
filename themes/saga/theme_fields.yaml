# ===================================
#  Field Definitions
# ===================================

fields:

    sitename:
        label: Site name
        comment: The website name as it should appear on the front-end
        default: SGN Help
        span: auto

    site_motto:
        label: Site motto
        comment: A short statement about the website.
        default: Build better websites
        span: auto

    facebook_url:
        label: Facebook URL
        span: auto
        default: https://www.facebook.com/lucid.com.au

    youtube_url:
        label: YouTube URL
        span: auto
        default: https://www.youtube.com/@LynetteL

    googleanalytics_id:
        label: Google Analytics ID
        comment: Google Analytics measurement ID (e.g. G-XXXXXXXXXX)
        span: auto
