list: $/derekbell/games/models/levels/columns.yaml
modelClass: DerekBell\Games\Models\Level
title: LevelController
noRecordsMessage: 'backend::lang.list.no_records'
showSetup: true
showCheckboxes: true
recordsPerPage: 20
toolbar:
    buttons: list_toolbar
    search:
        prompt: 'backend::lang.list.search_prompt'
recordUrl: 'derekbell/games/levelcontroller/update/:id'
filter:
    scopes:
        game:
            label: Filter by Game
            type: dropdown
            conditions: "episode_id IN (SELECT id FROM derekbell_games_episodes WHERE game_id = :filtered)"
            modelClass: DerekBell\Games\Models\Game
            options: getFilterOptions
            emptyOption: All Games
        episode:
            label: Filter by Episode
            type: group
            conditions: "episode_id in (:filtered)"
            modelClass: DerekBell\Games\Models\Episode
            nameFrom: title
            emptyOption: All Episodes
