<div data-control="toolbar">
    <button
        class="btn btn-default wn-icon-trash-o relation-button-delete"
        disabled="disabled"
        data-request="onRelationButtonDelete"
        data-request-confirm="Are you sure you want to delete the selected levels?"
        data-trigger-action="enable"
        data-trigger=".relation-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-request-success="$(this).prop('disabled', true)"
        data-stripe-load-indicator>
        Delete
    </button>
</div>
