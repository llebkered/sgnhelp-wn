<div id="import-upload-box">
    <form data-request="onUploadImportFile" data-request-files data-request-success="$('#import-upload-box').replaceWith(data.partial)">
        <input type="file" name="import_file" accept=".zip" required class="form-control" style="margin-bottom:10px;max-width:300px;">
        <button type="submit" class="btn btn-info">Upload</button>
    </form>
</div>
